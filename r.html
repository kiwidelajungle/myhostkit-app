<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Rapport de ménage</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%230B111E'/%3E%3Ctext x='32' y='44' font-family='Georgia,serif' font-size='34' font-style='italic' fill='%23C7A468' text-anchor='middle'%3EM%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300..560;1,9..144,300..560&family=DM+Sans:wght@300..600&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#0B111E;--card:#0F1626;--t1:#F2EDE1;--t2:rgba(242,237,225,.74);--t3:rgba(242,237,225,.55);--gold:#C7A468;--gold15:rgba(199,164,104,.16);--gold40:rgba(199,164,104,.4);--line:rgba(242,237,225,.1);--ok:#8FBC9F}
body{min-height:100svh;background:var(--bg);color:var(--t1);font-family:'DM Sans',sans-serif;font-weight:300;padding:34px 18px 70px;display:flex;justify-content:center}
.wrap{width:100%;max-width:560px}
.brand{font-family:'Fraunces',Georgia,serif;font-size:17px;text-align:center;margin-bottom:26px;color:var(--t2)}
.brand em{font-style:italic;color:var(--gold)}
.brand a{color:inherit;text-decoration:none}
.badge{display:block;width:max-content;margin:0 auto 14px;font-size:10px;text-transform:uppercase;letter-spacing:.22em;color:var(--gold);border:1px solid var(--gold40);border-radius:999px;padding:5px 14px}
h1{font-family:'Fraunces',Georgia,serif;font-weight:360;font-size:clamp(24px,6.4vw,31px);letter-spacing:-.015em;text-align:center;line-height:1.16;margin-bottom:8px}
h1 em{font-style:italic;color:var(--gold)}
.meta{text-align:center;color:var(--t3);font-size:13.5px;line-height:1.7;margin-bottom:26px}
.meta b{color:var(--t2);font-weight:500}
.card{background:var(--card);border:1px solid var(--line);padding:18px 20px;margin-bottom:14px;border-radius:2px}
.score{display:flex;align-items:center;gap:16px}
.score .n{font-family:'Fraunces',Georgia,serif;font-size:38px;color:var(--gold);font-weight:340;white-space:nowrap}
.score .n small{font-size:15px;color:var(--t3)}
.score .lbl{font-size:13.5px;color:var(--t2);line-height:1.55}
.score .lbl b{color:var(--t1);font-weight:500;display:block;font-size:14.5px}
.rooms{margin-top:14px;border-top:1px solid var(--line);padding-top:12px;display:grid;gap:8px}
.room{display:flex;align-items:baseline;gap:10px;font-size:13.5px}
.room .dot{color:var(--ok);font-size:11px}
.room .rn{color:var(--t1);font-weight:500;white-space:nowrap}
.room .rd{color:var(--t3)}
.room .rs{margin-left:auto;color:var(--gold);font-family:'Fraunces',Georgia,serif;white-space:nowrap}
.sect{font-size:10.5px;text-transform:uppercase;letter-spacing:.2em;color:var(--t3);margin:24px 0 10px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.ph{position:relative;display:block;aspect-ratio:4/3;background:var(--card);border:1px solid var(--line);overflow:hidden;border-radius:2px}
.ph img{width:100%;height:100%;object-fit:cover;display:block}
.ph .room-tag{position:absolute;left:8px;bottom:8px;font-size:10.5px;background:rgba(11,17,30,.82);color:var(--t1);padding:3px 9px;border-radius:999px;letter-spacing:.06em}
.ph.broken{display:flex;align-items:center;justify-content:center;color:var(--t3);font-size:12px;text-align:center;padding:12px}
.notes{font-size:14px;color:var(--t2);line-height:1.7;border-left:2px solid var(--gold40);padding-left:14px}
.verified{display:flex;align-items:center;gap:10px;font-size:12.5px;color:var(--t3);margin-top:22px;justify-content:center;text-align:center}
.cta{margin-top:34px;border:1px solid var(--gold40);background:linear-gradient(160deg,#121A2C,var(--card));padding:22px;text-align:center;border-radius:2px}
.cta h2{font-family:'Fraunces',Georgia,serif;font-weight:380;font-size:19px;margin-bottom:8px}
.cta h2 em{font-style:italic;color:var(--gold)}
.cta p{font-size:13.5px;color:var(--t2);line-height:1.65;margin-bottom:16px}
.btn{display:inline-block;background:var(--gold);color:#0B111E;text-decoration:none;font-size:12px;font-weight:500;text-transform:uppercase;letter-spacing:.13em;padding:14px 24px;border-radius:2px}
.btn2{display:inline-block;margin-top:12px;color:var(--gold);text-decoration:none;font-size:13px;border-bottom:1px solid var(--gold40)}
.state{text-align:center;color:var(--t3);font-size:14.5px;padding:60px 10px;line-height:1.7}
footer{margin-top:40px;text-align:center;font-size:11.5px;color:var(--t3)}
footer a{color:var(--t3)}
@media(min-width:520px){.grid{grid-template-columns:1fr 1fr 1fr}}
</style>
</head>
<body>
<div class="wrap">
  <div class="brand" id="brand"><a href="/">MyHost<em>Kit</em></a></div>
  <div id="content"><div class="state" id="loading">Chargement du rapport…</div></div>
</div>

<script>
(function(){
  var EP = 'https://illovwqvszjuasftwkxh.supabase.co/functions/v1/public-report';
  var m = window.location.pathname.match(/\/r\/([A-Za-z0-9_-]{10,80})/);
  var token = (m && m[1]) || new URLSearchParams(window.location.search).get('t') || '';
  var content = document.getElementById('content');
  function esc(s){ var d = document.createElement('div'); d.textContent = s == null ? '' : String(s); return d.innerHTML; }
  function fail(msg){ content.innerHTML = '<div class="state">' + esc(msg) + '</div>'; }
  function fmtDate(iso){
    try { return new Date(iso + 'T00:00:00').toLocaleDateString('fr-FR', { weekday:'long', day:'numeric', month:'long', year:'numeric' }); }
    catch(e){ return iso || ''; }
  }
  function cta(kind){
    try { fetch(EP, { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ action:'cta', token: token, cta: kind }) }); } catch(e){}
  }
  if (!token) { fail('Ce lien de rapport est incomplet.'); return; }

  fetch(EP, { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ action:'get', token: token }) })
  .then(function(r){ return r.json(); })
  .then(function(d){
    if (!d || !d.ok || !d.report) { fail('Ce rapport n\'existe pas ou n\'est plus partagé.'); return; }
    var rep = d.report, wl = d.white_label === true;
    if (wl) document.getElementById('brand').innerHTML = esc(d.brand_name || 'Rapport de ménage');

    var h = '';
    h += '<span class="badge">' + (rep.ai ? 'Rapport vérifié par IA' : 'Rapport de fin de ménage') + '</span>';
    h += '<h1>Ménage <em>terminé.</em></h1>';
    h += '<div class="meta">';
    if (rep.property && rep.property.name) h += '<b>' + esc(rep.property.name) + '</b>' + (rep.property.city ? ' · ' + esc(rep.property.city) : '') + '<br>';
    h += esc(fmtDate(rep.date)) + (rep.time ? ' · ' + esc(rep.time) : '');
    if (rep.cleaner_first_name) h += '<br>par <b>' + esc(rep.cleaner_first_name) + '</b>';
    h += '</div>';

    if (rep.ai || rep.ai_score) {
      var score = rep.ai_score || (rep.ai && rep.ai.averageScore) || null;
      h += '<div class="card"><div class="score">';
      if (score) h += '<div class="n">' + esc(Number(score).toFixed(1).replace('.0','')) + '<small>/10</small></div>';
      h += '<div class="lbl"><b>Qualité vérifiée par intelligence artificielle</b>Chaque photo est analysée automatiquement, pièce par pièce.</div></div>';
      var rooms = rep.ai && rep.ai.rooms;
      if (rooms && typeof rooms === 'object') {
        h += '<div class="rooms">';
        Object.keys(rooms).forEach(function(name){
          var r = rooms[name] || {};
          h += '<div class="room"><span class="dot">●</span><span class="rn">' + esc(name) + '</span><span class="rd">' + esc(r.details || '') + '</span>' + (r.score ? '<span class="rs">' + esc(r.score) + '/10</span>' : '') + '</div>';
        });
        h += '</div>';
      }
      h += '</div>';
    }

    if (rep.photos && rep.photos.length) {
      h += '<div class="sect">Photos de fin de mission (' + rep.photos.length + ')</div><div class="grid">';
      rep.photos.forEach(function(ph){
        h += '<a class="ph" href="' + esc(ph.url) + '" target="_blank" rel="noopener"><img loading="lazy" src="' + esc(ph.url) + '" alt="Photo du logement" onerror="this.parentNode.classList.add(\'broken\');this.parentNode.innerHTML=\'Photo disponible<br>(toucher pour ouvrir)\'">' + (ph.room ? '<span class="room-tag">' + esc(ph.room) + '</span>' : '') + '</a>';
      });
      h += '</div>';
    }

    if (rep.notes) h += '<div class="sect">Note de ' + esc(rep.cleaner_first_name || 'l\'agent') + '</div><div class="card"><div class="notes">' + esc(rep.notes) + '</div></div>';

    if (rep.submitted_at) {
      var dt = new Date(rep.submitted_at);
      h += '<div class="verified">Rapport horodaté le ' + esc(dt.toLocaleDateString('fr-FR')) + ' à ' + esc(dt.toLocaleTimeString('fr-FR', {hour:'2-digit',minute:'2-digit'})) + '</div>';
    }

    if (!wl) {
      h += '<div class="cta"><h2>Recevez ce rapport après <em>chaque ménage.</em></h2><p>MyHostKit remplit le planning de ménage automatiquement à chaque départ de voyageur, et l\'IA vérifie chaque rapport photo. Sans commission.</p><a class="btn" href="/" id="ctaHost">Découvrir MyHostKit</a><br><a class="btn2" href="/rejoindre" id="ctaCleaner">Vous faites des ménages ? L\'app est gratuite pour vous →</a></div>';
    }
    content.innerHTML = h;
    var ch = document.getElementById('ctaHost'); if (ch) ch.addEventListener('click', function(){ cta('hote'); });
    var cc = document.getElementById('ctaCleaner'); if (cc) cc.addEventListener('click', function(){ cta('cleaner'); });
  })
  .catch(function(){ fail('Impossible de charger le rapport. Vérifiez votre connexion et réessayez.'); });
})();
</script>
</body>
</html>
