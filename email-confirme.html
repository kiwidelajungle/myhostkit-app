<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<title>Email vérifié</title>
<!--
  Page d'atterrissage après confirmation d'e-mail (Supabase Auth).
  Neutre par défaut (MyHostKit) ; la marque d'un partenaire est posée par
  `?t=<slug>` (LoginScreen ajoute le paramètre à emailRedirectTo), résolu via
  la RPC publique resolve_tenant_by_slug (nom, couleurs). Audit 27/09, F15 :
  la page était brandée Keyla pour tous les inscrits.
-->
<style>
  :root { --bg:#F4F1EC; --card:#FFFFFF; --line:#E5DDD0; --ink:#1C1B1A; --soft:#5E5A55; --muted:#8B847C; --accent:#B89B7A; --head:#1C1B1A; --headtext:#F4F1EC; }
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
    background:var(--bg);
    min-height:100vh;
    display:flex; align-items:center; justify-content:center;
    padding:24px;
  }
  .card {
    background:var(--card);
    border:1px solid var(--line);
    border-radius:20px;
    max-width:440px; width:100%;
    overflow:hidden;
    box-shadow:0 10px 40px rgba(28,27,26,0.08);
  }
  .header {
    background:var(--head);
    padding:28px 40px;
    text-align:center;
  }
  .header .brand {
    font-family:Georgia,'Times New Roman',serif;
    font-style:italic;
    font-size:30px;
    color:var(--headtext);
    letter-spacing:-0.5px;
  }
  .header .brand .dot { color:var(--accent); }
  .body { padding:44px 40px 40px; text-align:center; }
  .check {
    width:76px; height:76px;
    border-radius:50%;
    background:var(--bg);
    border:2px solid var(--accent);
    display:flex; align-items:center; justify-content:center;
    margin:0 auto 28px;
  }
  .check svg { width:38px; height:38px; }
  h1 {
    font-size:23px; font-weight:600; color:var(--ink);
    margin-bottom:14px; letter-spacing:-0.3px;
  }
  p {
    font-size:15px; line-height:1.65; color:var(--soft);
    margin-bottom:8px;
  }
  .hint {
    margin-top:28px;
    background:var(--bg);
    border-radius:12px;
    padding:16px 20px;
    font-size:13.5px; color:var(--muted); line-height:1.6;
  }
  .footer {
    padding:20px 40px;
    text-align:center;
    border-top:1px solid var(--line);
    background:var(--bg);
  }
  .footer .brand {
    font-family:Georgia,serif; font-style:italic;
    font-size:15px; color:var(--muted);
  }
  .footer .brand .dot { color:var(--accent); }
</style>
<link rel="icon" href="/favicon.ico" sizes="48x48">
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png">
<link rel="icon" type="image/png" sizes="48x48" href="/favicon-48.png">
<link rel="icon" type="image/png" sizes="192x192" href="/favicon-192.png">
<link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
</head>
<body>
  <div class="card">
    <div class="header">
      <span class="brand"><span class="brand-name">MyHostKit</span><span class="dot">.</span></span>
    </div>
    <div class="body">
      <div class="check">
        <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M5 13l4 4L19 7" stroke="#B89B7A" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </div>
      <h1>Votre email est vérifié</h1>
      <p>Votre adresse a bien été confirmée. Votre compte est désormais activé.</p>
      <div class="hint">
        Vous pouvez maintenant retourner dans l'application et vous connecter avec votre email et votre mot de passe.
      </div>
    </div>
    <div class="footer">
      <span class="brand"><span class="brand-name">MyHostKit</span><span class="dot">.</span></span>
    </div>
  </div>
<script>
(function(){
  var slug = new URLSearchParams(location.search).get('t') || '';
  if (!slug || !/^[a-z0-9-]{2,40}$/i.test(slug) || slug.toLowerCase() === 'myhostkit') return;
  var SB = 'https://illovwqvszjuasftwkxh.supabase.co';
  var ANON = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImlsbG92d3F2c3pqdWFzZnR3a3hoIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzUzMTk4NDQsImV4cCI6MjA5MDg5NTg0NH0.EMR86eBRtW9tF118YB1Xq2NL08FajJ7HLp51YwmF4_Y';
  fetch(SB + '/rest/v1/rpc/resolve_tenant_by_slug', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json', 'apikey': ANON, 'Authorization': 'Bearer ' + ANON },
    body: JSON.stringify({ p_slug: slug.toLowerCase() })
  }).then(function(r){ return r.json(); }).then(function(rows){
    var t = Array.isArray(rows) ? rows[0] : rows;
    if (!t || !(t.app_name || t.name)) return;
    var nom = String(t.app_name || t.name);
    document.title = 'Email vérifié — ' + nom;
    Array.prototype.forEach.call(document.querySelectorAll('.brand-name'), function(el){ el.textContent = nom; });
    var ok = function(c){ return typeof c === 'string' && /^#[0-9a-f]{3,8}$/i.test(c.trim()); };
    var root = document.documentElement.style;
    if (ok(t.primary_color)) root.setProperty('--head', t.primary_color.trim());
    if (ok(t.accent_color)) root.setProperty('--accent', t.accent_color.trim());
    if (ok(t.bg_color)) root.setProperty('--bg', t.bg_color.trim());
    if (ok(t.text_color)) root.setProperty('--ink', t.text_color.trim());
  }).catch(function(){});
})();
</script>
</body>
</html>
