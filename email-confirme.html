<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<title>Email vérifié — Keyla</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
    background:#F4F1EC;
    min-height:100vh;
    display:flex; align-items:center; justify-content:center;
    padding:24px;
  }
  .card {
    background:#FFFFFF;
    border:1px solid #E5DDD0;
    border-radius:20px;
    max-width:440px; width:100%;
    overflow:hidden;
    box-shadow:0 10px 40px rgba(28,27,26,0.08);
  }
  .header {
    background:#1C1B1A;
    padding:28px 40px;
    text-align:center;
  }
  .header .brand {
    font-family:Georgia,'Times New Roman',serif;
    font-style:italic;
    font-size:30px;
    color:#F4F1EC;
    letter-spacing:-0.5px;
  }
  .header .brand .dot { color:#B89B7A; }
  .body { padding:44px 40px 40px; text-align:center; }
  .check {
    width:76px; height:76px;
    border-radius:50%;
    background:#F4F1EC;
    border:2px solid #B89B7A;
    display:flex; align-items:center; justify-content:center;
    margin:0 auto 28px;
  }
  .check svg { width:38px; height:38px; }
  h1 {
    font-size:23px; font-weight:600; color:#1C1B1A;
    margin-bottom:14px; letter-spacing:-0.3px;
  }
  p {
    font-size:15px; line-height:1.65; color:#5E5A55;
    margin-bottom:8px;
  }
  .hint {
    margin-top:28px;
    background:#F4F1EC;
    border-radius:12px;
    padding:16px 20px;
    font-size:13.5px; color:#8B847C; line-height:1.6;
  }
  .footer {
    padding:20px 40px;
    text-align:center;
    border-top:1px solid #E5DDD0;
    background:#F4F1EC;
  }
  .footer .brand {
    font-family:Georgia,serif; font-style:italic;
    font-size:15px; color:#8B847C;
  }
  .footer .brand .dot { color:#B89B7A; }
</style>
</head>
<body>
  <div class="card">
    <div class="header">
      <span class="brand">Keyla<span class="dot">.</span></span>
    </div>
    <div class="body">
      <div class="check">
        <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M5 13l4 4L19 7" stroke="#B89B7A" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </div>
      <h1>Votre email est vérifié</h1>
      <p>Votre adresse a bien été confirmée. Votre compte est désormais activé.</p>
      <div class="hint">
        Vous pouvez maintenant retourner dans l'application et vous connecter avec votre email et votre mot de passe.
      </div>
    </div>
    <div class="footer">
      <span class="brand">Keyla<span class="dot">.</span></span>
    </div>
  </div>
</body>
</html>
