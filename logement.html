<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Réserver ce logement</title>
<style>
  :root{--navy:#0B1B33;--gold:#C7A468;--paper:#F7F4EC;--card:#fff;--ink:#16202E;--soft:#5A6473;--line:#E6E1D5;--err:#A04B42;--okc:#2F6B44}
  *{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:15px/1.55 -apple-system,"Segoe UI",Roboto,sans-serif}
  .wrap{max-width:820px;margin:0 auto;padding:0 18px 60px}
  header{background:var(--navy);color:#F2EDE1;padding:22px 0 18px;margin-bottom:0}
  .brand{font-family:Georgia,serif;font-size:19px;font-weight:600}
  .brand em{color:var(--gold);font-style:italic;font-weight:400}
  .tag{color:var(--gold);font-size:10.5px;letter-spacing:1.6px;text-transform:uppercase;font-weight:600;margin-top:2px}
  .hero{position:relative;border-radius:0 0 18px 18px;overflow:hidden;background:#0B1B33}
  .hero img{width:100%;height:300px;object-fit:cover;display:block;opacity:.96}
  .hero .ph{height:220px;display:flex;align-items:center;justify-content:center;font-size:52px}
  .price{position:absolute;right:16px;bottom:16px;background:rgba(11,27,51,.85);color:#F2EDE1;border:1px solid var(--gold);border-radius:100px;padding:7px 15px;font-size:14px;font-weight:700}
  .price small{font-weight:400;opacity:.8}
  .thumbs{display:flex;gap:8px;margin-top:10px;overflow-x:auto;padding-bottom:4px}
  .thumbs img{width:92px;height:64px;object-fit:cover;border-radius:9px;flex:0 0 auto;cursor:pointer;border:2px solid transparent}
  .thumbs img.on{border-color:var(--gold)}
  h1{font-family:Georgia,serif;font-size:26px;letter-spacing:-.3px;margin:18px 0 2px}
  .sub{color:var(--soft);font-size:14px;margin-bottom:10px}
  .chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:22px}
  .chip{background:var(--card);border:1px solid var(--line);border-radius:100px;padding:5px 13px;font-size:12.5px;color:var(--soft);font-weight:600}
  h2{font-family:Georgia,serif;font-size:19px;margin:24px 0 12px}
  .form{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:20px}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  @media(max-width:560px){.grid2{grid-template-columns:1fr}}
  label{display:block;font-size:10.5px;letter-spacing:1.1px;text-transform:uppercase;color:var(--soft);font-weight:700;margin:12px 0 5px}
  input,textarea,select{width:100%;border:1px solid var(--line);border-radius:10px;padding:11px 12px;font:14px/1.4 inherit;background:var(--paper);color:var(--ink)}
  input:focus,textarea:focus,select:focus{outline:2px solid var(--gold);outline-offset:0;border-color:var(--gold)}
  textarea{min-height:76px;resize:vertical}
  .estimate{margin-top:14px;font-size:13.5px;color:var(--soft)}
  .estimate b{color:var(--navy);font-size:15px}
  .warn{margin-top:10px;color:var(--err);font-size:13px;font-weight:600;display:none}
  button{margin-top:16px;width:100%;background:var(--gold);color:var(--navy);border:0;border-radius:12px;padding:14px;font-size:15px;font-weight:700;cursor:pointer}
  button:hover{opacity:.9}button:disabled{opacity:.5;cursor:default}
  .note{font-size:11.5px;color:var(--soft);text-align:center;margin-top:10px}
  #success{display:none;background:var(--card);border:1px solid var(--line);border-left:3px solid var(--okc);border-radius:16px;padding:26px;text-align:center}
  #success h2{margin-top:0}
  #success p{color:var(--soft);font-size:14px}
  footer{margin-top:34px;color:var(--soft);font-size:12px;text-align:center}
  #loading{padding:90px 0;text-align:center;color:var(--soft)}
  .spin{width:26px;height:26px;border:3px solid var(--line);border-top-color:var(--gold);border-radius:50%;margin:0 auto 14px;animation:r 1s linear infinite}
  @keyframes r{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<header><div class="wrap">
  <div class="brand" id="brand">MyHost<em>Kit</em></div>
  <div class="tag">Réservation directe</div>
</div></header>

<div class="wrap" style="padding-top:0">
  <div id="loading"><div class="spin"></div>Chargement du logement…</div>
  <div id="content" style="display:none"></div>
</div>

<script>
(function(){
  var EP = 'https://illovwqvszjuasftwkxh.supabase.co/functions/v1/direct-booking';
  var token = new URLSearchParams(location.search).get('t') || '';
  var booked = [];
  var price = null;

  function el(tag, cls, text){
    var e = document.createElement(tag);
    if (cls) e.className = cls;
    if (text != null) e.textContent = text;
    return e;
  }
  function fail(msg){
    var L = document.getElementById('loading');
    L.innerHTML = '';
    L.appendChild(el('h1', null, 'Logement introuvable'));
    L.appendChild(el('p', 'sub', msg || "Ce lien n'est plus valide. Demandez un nouveau lien à votre hôte."));
  }
  if (!token) { fail(); return; }

  function overlap(ci, co){
    return booked.some(function(r){ return ci < r.to && co > r.from; });
  }
  function nightsOf(ci, co){
    return Math.round((new Date(co + 'T12:00:00Z') - new Date(ci + 'T12:00:00Z')) / 86400000);
  }

  fetch(EP, { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ action:'get', t: token }) })
    .then(function(r){ return r.json(); })
    .then(function(d){
      if (!d || !d.ok) { fail(); return; }
      booked = d.booked || [];
      var p = d.property || {};
      price = p.price_per_night;

      if (d.brand) {
        document.documentElement.style.setProperty('--navy', d.brand.navy || '#0B1B33');
        document.documentElement.style.setProperty('--gold', d.brand.accent || '#C7A468');
        if (!d.brand.is_myhostkit) document.getElementById('brand').textContent = d.brand.name || '';
        document.title = (p.name || 'Logement') + ' — réservation directe';
      }

      var C = document.getElementById('content');

      /* Héro + galerie */
      var hero = el('div','hero');
      var mainImg = null;
      if (p.photos && p.photos.length) {
        mainImg = document.createElement('img'); mainImg.src = p.photos[0]; mainImg.alt = '';
        hero.appendChild(mainImg);
      } else {
        hero.appendChild(el('div','ph','🏡'));
      }
      if (price != null) {
        var pr = el('div','price', Math.round(price) + ' € ');
        var sm = document.createElement('small'); sm.textContent = '/ nuit'; pr.appendChild(sm);
        hero.appendChild(pr);
      }
      C.appendChild(hero);
      if (p.photos && p.photos.length > 1) {
        var th = el('div','thumbs');
        p.photos.forEach(function(u, i){
          var im = document.createElement('img'); im.src = u; im.alt = '';
          if (i === 0) im.className = 'on';
          im.onclick = function(){
            if (mainImg) mainImg.src = u;
            Array.prototype.forEach.call(th.children, function(c){ c.className = ''; });
            im.className = 'on';
          };
          th.appendChild(im);
        });
        C.appendChild(th);
      }

      C.appendChild(el('h1', null, p.name || 'Logement'));
      C.appendChild(el('div','sub', p.city || ''));
      var chips = el('div','chips');
      if (p.type) chips.appendChild(el('span','chip', p.type));
      if (p.capacity) chips.appendChild(el('span','chip', p.capacity + ' personne' + (p.capacity > 1 ? 's' : '')));
      if (p.rooms) chips.appendChild(el('span','chip', p.rooms + ' ch.'));
      chips.appendChild(el('span','chip', 'Arrivée ' + (p.check_in_time || '15:00')));
      chips.appendChild(el('span','chip', 'Départ ' + (p.check_out_time || '11:00')));
      C.appendChild(chips);

      /* Formulaire */
      C.appendChild(el('h2', null, 'Demander ces dates'));
      var f = el('div','form');
      f.innerHTML =
        '<div class="grid2">' +
        '  <div><label for="ci">Arrivée</label><input type="date" id="ci"></div>' +
        '  <div><label for="co">Départ</label><input type="date" id="co"></div>' +
        '</div>' +
        '<div class="warn" id="warn">Ces dates ne sont pas disponibles — choisissez d\'autres dates.</div>' +
        '<div class="estimate" id="estimate"></div>' +
        '<div class="grid2">' +
        '  <div><label for="gn">Votre nom</label><input id="gn" maxlength="80" autocomplete="name"></div>' +
        '  <div><label for="gc">Voyageurs</label><select id="gc"></select></div>' +
        '</div>' +
        '<div class="grid2">' +
        '  <div><label for="ge">E-mail</label><input type="email" id="ge" maxlength="200" autocomplete="email"></div>' +
        '  <div><label for="gp">Téléphone (optionnel)</label><input type="tel" id="gp" maxlength="30" autocomplete="tel"></div>' +
        '</div>' +
        '<label for="gm">Message (optionnel)</label><textarea id="gm" maxlength="1000" placeholder="Une question, une précision sur votre séjour…"></textarea>' +
        '<button id="go">Envoyer ma demande</button>' +
        '<div class="note">Sans paiement ni engagement — votre hôte confirme la réservation par e-mail.</div>';
      C.appendChild(f);

      var success = el('div', null); success.id = 'success';
      success.appendChild(el('h2', null, 'Demande envoyée ✓'));
      success.appendChild(el('p', null, 'Votre hôte vient de la recevoir. Vous recevrez sa réponse par e-mail — pensez à vérifier vos indésirables.'));
      C.appendChild(success);

      var foot = el('footer', null, 'Page sécurisée fournie par ' + ((d.brand && d.brand.name) || 'MyHostKit'));
      C.appendChild(foot);

      /* Comportement */
      var today = new Date().toISOString().slice(0, 10);
      var ci = f.querySelector('#ci'), co = f.querySelector('#co'),
          warn = f.querySelector('#warn'), est = f.querySelector('#estimate'),
          gc = f.querySelector('#gc'), go = f.querySelector('#go');
      ci.min = today; co.min = today;
      var cap = Math.max(1, Math.min(30, p.capacity || 8));
      for (var i = 1; i <= cap; i++) {
        var o = document.createElement('option'); o.value = i; o.textContent = i; gc.appendChild(o);
      }

      /* Devis serveur : tarifs saisonniers + séjour minimum (repli : prix de base) */
      var quoteTimer = null;
      function showEstimate(n, total){
        est.innerHTML = '';
        est.appendChild(document.createTextNode(n + ' nuit' + (n > 1 ? 's' : '') + (total != null ? ' · environ ' : '')));
        if (total != null) {
          est.appendChild(el('b', null, Math.round(total).toLocaleString('fr-FR') + ' €'));
          est.appendChild(document.createTextNode(' (à confirmer par votre hôte)'));
        }
      }
      function refresh(){
        warn.style.display = 'none'; est.textContent = '';
        warn.textContent = 'Ces dates ne sont pas disponibles — choisissez d\'autres dates.';
        if (!ci.value || !co.value) return;
        if (co.value <= ci.value) { co.value = ''; return; }
        if (overlap(ci.value, co.value)) { warn.style.display = 'block'; return; }
        var n = nightsOf(ci.value, co.value);
        if (n <= 0) return;
        showEstimate(n, price != null ? price * n : null);
        if (quoteTimer) clearTimeout(quoteTimer);
        var qci = ci.value, qco = co.value;
        quoteTimer = setTimeout(function(){
          fetch(EP, { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ action:'quote', t: token, checkin: qci, checkout: qco }) })
            .then(function(r){ return r.json(); })
            .then(function(qd){
              if (ci.value !== qci || co.value !== qco) return; /* dates changées entre-temps */
              if (!qd || !qd.ok) return;
              if (qd.min_stay_ok === false) {
                warn.textContent = 'Séjour minimum de ' + qd.min_stay + ' nuits sur ces dates.';
                warn.style.display = 'block'; est.textContent = '';
                return;
              }
              if (qd.total != null) showEstimate(qd.nights || n, qd.total);
            })
            .catch(function(){});
        }, 250);
      }
      ci.onchange = function(){ if (ci.value) co.min = ci.value; refresh(); };
      co.onchange = refresh;

      go.onclick = function(){
        var name = f.querySelector('#gn').value.trim();
        var email = f.querySelector('#ge').value.trim();
        if (!ci.value || !co.value) { alert('Choisissez vos dates d\'arrivée et de départ.'); return; }
        if (overlap(ci.value, co.value)) { warn.style.display = 'block'; return; }
        if (name.length < 2) { alert('Indiquez votre nom.'); return; }
        if (!/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(email)) { alert('Indiquez un e-mail valide.'); return; }
        go.disabled = true; go.textContent = 'Envoi…';
        fetch(EP, { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({
          action:'request', t: token,
          guest_name: name, guest_email: email,
          guest_phone: f.querySelector('#gp').value.trim(),
          checkin: ci.value, checkout: co.value,
          guests_count: parseInt(gc.value, 10) || 1,
          message: f.querySelector('#gm').value.trim(),
        }) })
        .then(function(r){ return r.json().then(function(j){ return { s: r.status, j: j }; }); })
        .then(function(x){
          if (x.j && x.j.ok) { f.style.display = 'none'; success.style.display = 'block'; window.scrollTo(0, 0); return; }
          go.disabled = false; go.textContent = 'Envoyer ma demande';
          if (x.j && x.j.error === 'dates_unavailable') { warn.style.display = 'block'; }
          else if (x.j && x.j.error === 'min_stay') { warn.textContent = 'Séjour minimum de ' + (x.j.min_stay || 2) + ' nuits sur ces dates.'; warn.style.display = 'block'; }
          else if (x.j && x.j.error === 'too_many_requests') { alert('Trop de demandes pour ce logement aujourd\'hui — réessayez demain.'); }
          else { alert('Envoi impossible pour le moment. Réessayez dans quelques minutes.'); }
        })
        .catch(function(){
          go.disabled = false; go.textContent = 'Envoyer ma demande';
          alert('Envoi impossible pour le moment. Réessayez dans quelques minutes.');
        });
      };

      document.getElementById('loading').style.display = 'none';
      C.style.display = 'block';
    })
    .catch(function(){ fail('Impossible de charger la page pour le moment. Réessayez dans quelques minutes.'); });
})();
</script>
</body>
</html>
