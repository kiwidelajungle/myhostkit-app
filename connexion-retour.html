<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Connexion Airbnb</title>
<!--
  Page de retour de la connexion Airbnb. Les fonctions Supabase ne peuvent pas
  afficher de page : sur leur domaine, le HTML est servi en texte brut. Elles
  redirigent donc ici, avec l'issue en paramètre :
    ?r=ok&proprio=1  propriétaire qui vient d'autoriser via le lien reçu
    ?r=ok            hôte qui vient d'autoriser depuis l'application
    ?r=ko            refus ou échec chez Airbnb
    ?e=<code>        lien propriétaire inutilisable (voir PAGES ci-dessous)
-->
<style>
  :root { color-scheme: light; }
  * { box-sizing: border-box; }
  body { margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center;
         background:#F4F1EC; color:#1C1B1A; padding:24px;
         font:16px/1.55 -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif; }
  .c { background:#fff; border-radius:18px; padding:32px 26px; max-width:460px; width:100%;
       text-align:center; box-shadow:0 10px 40px rgba(28,27,26,.08); }
  .emoji { font-size:44px; line-height:1; margin-bottom:14px; }
  h1 { font-size:20px; margin:0 0 12px; }
  p { margin:0 0 12px; color:#5E5A55; font-size:15px; }
  ol { text-align:left; margin:0 0 12px; padding-left:20px; color:#5E5A55; font-size:15px; }
  li { margin-bottom:6px; }
  .note { margin-top:18px; font-size:13px; color:#8B847C; }
</style>
<link rel="icon" href="/favicon.ico" sizes="48x48">
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png">
<link rel="icon" type="image/png" sizes="48x48" href="/favicon-48.png">
<link rel="icon" type="image/png" sizes="192x192" href="/favicon-192.png">
<link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
</head>
<body>
  <div class="c">
    <div class="emoji" id="emoji">✅</div>
    <h1 id="titre">Connexion Airbnb</h1>
    <div id="corps"></div>
    <p class="note">Vous pouvez fermer cette fenêtre.</p>
  </div>
<script>
  (function () {
    var q = new URLSearchParams(location.search);
    var PAGES = {
      ok_proprio: ['✅', "Merci, c'est fait",
        ["Votre compte Airbnb est autorisé.",
         "Votre conciergerie termine le branchement de son côté : vous n'avez plus rien à faire."]],
      ok: ['✅', 'Votre compte Airbnb est connecté',
        ["Revenez dans l'application : il ne reste qu'à choisir l'annonce qui correspond à ce logement."]],
      ko: ['⚠️', "La connexion n'a pas abouti",
        ["Rien n'a été modifié sur votre annonce.",
         ["Relancez la connexion depuis le même lien ou depuis l'application.",
          "Identifiez-vous avec le compte Airbnb qui détient l'annonce : un co-hôte ne peut pas autoriser.",
          "Si Airbnb vous demande un code, saisissez celui reçu par SMS ou e-mail, puis touchez « Autoriser »."]]],
      invalide: ['⚠️', 'Lien invalide',
        ["Cette adresse n'est pas reconnue. Demandez un nouveau lien à votre conciergerie."]],
      inconnu: ['⚠️', 'Lien inconnu',
        ["Ce lien n'existe pas ou a été remplacé par un plus récent. Demandez-en un nouveau à votre conciergerie."]],
      expire: ['⏳', 'Lien expiré',
        ["Ce lien n'est plus valable. Demandez-en un nouveau à votre conciergerie : il se génère en un instant."]],
      non_prepare: ['⚠️', 'Logement pas encore prêt',
        ["Ce logement n'est pas encore prêt à être relié. Votre conciergerie doit d'abord le préparer de son côté, puis vous renvoyer le lien."]],
      indisponible: ['⚠️', 'Connexion momentanément indisponible',
        ["Réessayez dans quelques minutes avec le même lien : il reste valable."]],
      airbnb: ['⚠️', "Airbnb n'a pas répondu",
        ["Réessayez dans quelques minutes avec le même lien : il reste valable."]]
    };
    var cle = q.get('e') || (q.get('r') === 'ko' ? 'ko' : (q.get('proprio') ? 'ok_proprio' : 'ok'));
    var p = PAGES[cle] || PAGES.indisponible;
    document.getElementById('emoji').textContent = p[0];
    document.getElementById('titre').textContent = p[1];
    document.title = p[1];
    var corps = document.getElementById('corps');
    p[2].forEach(function (bloc) {
      if (Array.isArray(bloc)) {
        var ol = document.createElement('ol');
        bloc.forEach(function (x) { var li = document.createElement('li'); li.textContent = x; ol.appendChild(li); });
        corps.appendChild(ol);
      } else {
        var el = document.createElement('p'); el.textContent = bloc; corps.appendChild(el);
      }
    });
  })();
</script>
</body>
</html>
