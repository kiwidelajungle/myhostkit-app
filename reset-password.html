<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<title>Réinitialiser le mot de passe</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
    background:#F5F5F5; min-height:100vh;
    display:flex; align-items:center; justify-content:center; padding:24px;
  }
  .card {
    background:#FFFFFF; border:1px solid #E5E5E5; border-radius:18px;
    max-width:420px; width:100%; overflow:hidden;
    box-shadow:0 8px 32px rgba(0,0,0,0.06);
  }
  .header { background:#1A1A1A; padding:24px 36px; text-align:center; }
  .header span { font-size:16px; font-weight:600; color:#fff; letter-spacing:0.5px; }
  .body { padding:36px; }
  h1 { font-size:20px; font-weight:600; color:#1A1A1A; margin-bottom:10px; }
  p.sub { font-size:14px; line-height:1.6; color:#666; margin-bottom:24px; }
  label { display:block; font-size:11px; font-weight:600; color:#888; letter-spacing:1px; text-transform:uppercase; margin-bottom:8px; }
  input {
    width:100%; padding:14px 16px; font-size:15px;
    background:#F7F7F7; border:1.5px solid #E5E5E5; border-radius:10px;
    color:#1A1A1A; margin-bottom:16px; outline:none;
  }
  input:focus { border-color:#1A1A1A; background:#fff; }
  button {
    width:100%; padding:15px; font-size:15px; font-weight:600;
    color:#fff; background:#1A1A1A; border:none; border-radius:10px; cursor:pointer;
  }
  button:disabled { background:#CCC; cursor:not-allowed; }
  .msg { font-size:13.5px; line-height:1.6; padding:14px 16px; border-radius:10px; margin-bottom:16px; display:none; }
  .msg.error { background:#FDECEC; color:#C0392B; display:block; }
  .msg.ok { background:#EAF7EE; color:#1E7E34; display:block; }
  .center { text-align:center; }
  .check { width:64px; height:64px; border-radius:50%; background:#EAF7EE; display:none; align-items:center; justify-content:center; margin:0 auto 20px; }
  .check svg { width:32px; height:32px; }
  .hint { font-size:12.5px; color:#999; margin-top:18px; text-align:center; line-height:1.6; }
  .footer { background:#FAFAFA; padding:16px 36px; text-align:center; border-top:1px solid #EEE; }
  .footer span { font-size:12px; color:#AAA; }
</style>
</head>
<body>
  <div class="card">
    <div class="header"><span>Réinitialisation</span></div>
    <div class="body">
      <div class="check" id="check">
        <svg viewBox="0 0 24 24" fill="none"><path d="M5 13l4 4L19 7" stroke="#1E7E34" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </div>
      <h1 id="title">Nouveau mot de passe</h1>
      <p class="sub" id="sub">Choisissez un nouveau mot de passe pour votre compte.</p>

      <div class="msg" id="msg"></div>

      <div id="form">
        <label>Nouveau mot de passe</label>
        <input type="password" id="pw1" placeholder="Au moins 6 caractères" autocomplete="new-password">
        <label>Confirmer le mot de passe</label>
        <input type="password" id="pw2" placeholder="Répétez le mot de passe" autocomplete="new-password">
        <button id="btn" disabled>Vérification du lien…</button>
        <p class="hint" id="hint">Initialisation en cours…</p>
      </div>
    </div>
    <div class="footer"><span>Email automatique, merci de ne pas y répondre.</span></div>
  </div>

<script type="module">
import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';

const SUPABASE_URL = 'https://illovwqvszjuasftwkxh.supabase.co';
const SUPABASE_ANON = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImlsbG92d3F2c3pqdWFzZnR3a3hoIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzUzMTk4NDQsImV4cCI6MjA5MDg5NTg0NH0.EMR86eBRtW9tF118YB1Xq2NL08FajJ7HLp51YwmF4_Y';

const supabase = createClient(SUPABASE_URL, SUPABASE_ANON, {
  auth: { detectSessionInUrl: true, flowType: 'implicit', persistSession: false }
});

const $ = (id) => document.getElementById(id);
const btn = $('btn'), pw1 = $('pw1'), pw2 = $('pw2'), msg = $('msg'), hint = $('hint');

function showMsg(text, type) { msg.textContent = text; msg.className = 'msg ' + type; }

let sessionReady = false;

async function init() {
  try {
    // 1) Flux PKCE : ?code=... dans l'URL
    const params = new URLSearchParams(window.location.search);
    if (params.get('code')) {
      const { error } = await supabase.auth.exchangeCodeForSession(params.get('code'));
      if (error) throw error;
    }
    // 2) Flux implicit (#access_token=...) géré par detectSessionInUrl
    // On vérifie la session
    const { data } = await supabase.auth.getSession();
    if (data && data.session) {
      sessionReady = true;
      btn.disabled = false;
      btn.textContent = 'Enregistrer le nouveau mot de passe';
      hint.textContent = '';
    } else {
      // Attendre l'event PASSWORD_RECOVERY au cas où
      supabase.auth.onAuthStateChange((event, session) => {
        if (session) {
          sessionReady = true;
          btn.disabled = false;
          btn.textContent = 'Enregistrer le nouveau mot de passe';
          hint.textContent = '';
        }
      });
      setTimeout(() => {
        if (!sessionReady) {
          showMsg("Ce lien est invalide ou a expiré. Refaites une demande de réinitialisation depuis l'application.", 'error');
          btn.textContent = 'Lien invalide';
          hint.textContent = '';
        }
      }, 2500);
    }
  } catch (e) {
    showMsg("Ce lien est invalide ou a expiré. Refaites une demande depuis l'application.", 'error');
    btn.textContent = 'Lien invalide';
    hint.textContent = '';
  }
}

btn.addEventListener('click', async () => {
  if (!sessionReady) return;
  const p1 = pw1.value, p2 = pw2.value;
  if (p1.length < 6) { showMsg('Le mot de passe doit faire au moins 6 caractères.', 'error'); return; }
  if (p1 !== p2) { showMsg('Les deux mots de passe ne correspondent pas.', 'error'); return; }
  btn.disabled = true; btn.textContent = 'Enregistrement…'; msg.className = 'msg';
  const { error } = await supabase.auth.updateUser({ password: p1 });
  if (error) {
    showMsg('Erreur : ' + error.message, 'error');
    btn.disabled = false; btn.textContent = 'Réessayer';
    return;
  }
  // Succès
  $('form').style.display = 'none';
  $('check').style.display = 'flex';
  $('title').textContent = 'Mot de passe modifié';
  $('sub').textContent = 'Votre mot de passe a bien été changé. Retournez dans l\'application et connectez-vous avec votre nouveau mot de passe.';
  showMsg('', '');
  await supabase.auth.signOut();
});

init();
</script>
</body>
</html>
